<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>RideShare AAB - Offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { margin: 0; background: #f1f5f9; color: #0f172a; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
      header { margin-bottom: 24px; }
      h1 { margin: 0 0 8px; }
      p { line-height: 1.5; }
      .status { color: #475569; }
      .notice { padding: 12px; border-radius: 8px; background: #fef3c7; color: #92400e; }
      .list { display: grid; gap: 12px; }
      .card { padding: 16px; border-radius: 12px; background: white; box-shadow: 0 2px 8px #00000012; }
      .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
      .card p { margin: 4px 0; }
      button { margin: 16px 0; padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
      button:disabled { background: #94a3b8; cursor: not-allowed; }
      a { color: #1d4ed8; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>RideShare AAB</h1>
        <p class="status" id="status">Po lexohet kopja publike...</p>
        <p id="saved-at"></p>
        <button id="refresh" type="button">Rifresko listën</button>
      </header>
      <section class="list" id="trips" aria-live="polite"></section>
      <p class="notice">Kjo pamje lexon vetëm të dhënat publike dhe nuk konfirmon rezervime.</p>
    </main>
    <script>
      const tripsElement = document.getElementById("trips");
      const statusElement = document.getElementById("status");
      const savedAtElement = document.getElementById("saved-at");
      const refreshButton = document.getElementById("refresh");

      function showTrip(trip) {
        const card = document.createElement("article");
        card.className = "card";
        const title = document.createElement("h2");
        title.textContent = trip.nisja + " → " + trip.destinacioni;
        const time = document.createElement("p");
        time.textContent = "Ora: " + trip.ora;
        const meetingPoint = document.createElement("p");
        meetingPoint.textContent = "Vendtakimi: " + trip.vendtakimi;
        const seats = document.createElement("p");
        seats.textContent = "Vende të lira: " + trip.vende;
        const requestButton = document.createElement("button");
        requestButton.type = "button";
        requestButton.disabled = true;
        requestButton.textContent = "Kërko vend";
        card.append(title, time, meetingPoint, seats, requestButton);
        tripsElement.appendChild(card);
      }

      async function loadTrips() {
        refreshButton.disabled = true;
        statusElement.textContent = "Po lexohet lista...";
        tripsElement.replaceChildren();
        try {
          const response = await fetch("/api/udhetimet", { cache: "no-store" });
          const data = await response.json();
          if (!response.ok || !Array.isArray(data.trips)) {
            throw new Error("Lista nuk është e disponueshme.");
          }
          data.trips.forEach(showTrip);
          const source = response.headers.get("X-RideShare-Source");
          statusElement.textContent = source === "cache"
            ? "Lista vjen nga kopja e ruajtur në pajisje."
            : "Lista vjen nga serveri dhe u ruajt në pajisje.";
          const savedAt = response.headers.get("X-RideShare-Saved-At");
          savedAtElement.textContent = savedAt
            ? "Koha e ruajtjes: " + new Date(savedAt).toLocaleString("sq-AL")
            : "";
        } catch (error) {
          statusElement.textContent = "Nuk ka kopje publike të disponueshme.";
          savedAtElement.textContent = "";
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener("click", loadTrips);
      loadTrips();
    </script>
  </body>
</html>
